mapping:
  - target: global_buffer
    type: datatype
    keep:
      - Weights
      - Inputs
    bypass:
      - Outputs
  - target: DRAM
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: global_buffer
    type: spatial
    factors: R3 S3 P1 Q1 C1 K1 N1
    permutation: RSPQCKN
    split: 2
  - target: global_buffer
    type: temporal
    factors: R1 S1 P16 Q16 C1 K1 N1
    permutation: PQRSCKN
  - target: DRAM
    type: temporal
    factors: R1 S1 P1 Q1 C1 K1 N1
    permutation: RSPQCKN