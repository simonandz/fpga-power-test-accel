architecture:
    version: '0.4'
    local:
      - name: system.chip.PE[0..8].mac
        class: intmac
        attributes:
            datawidth: 8
            width: 8
            technology: "45nm"
            global_cycle_seconds: 1e-09
        area_scale: 1.0
        energy_scale: 1.0
      - name: system.chip.global_buffer
        class: SRAM
        attributes:
            depth: 521
            width: 8
            datawidth: 8
            word_bits: 8
            n_banks: 4
            n_rdwr_ports: 2
            technology: "45nm"
            global_cycle_seconds: 1e-09
        area_scale: 1.0
        energy_scale: 1.0
      - name: system.DRAM
        class: DRAM
        attributes:
            width: 8
            datawidth: 8
            type: "LPDDR4"
            technology: "45nm"
            global_cycle_seconds: 1e-09
        area_scale: 1.0
        energy_scale: 1.0
