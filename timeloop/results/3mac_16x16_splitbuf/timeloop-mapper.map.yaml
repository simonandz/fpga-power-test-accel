mapping:
  - target: ofmap_buffer
    type: datatype
    keep:
      []
    bypass:
      - Weights
      - Inputs
      - Outputs
  - target: weight_buffer
    type: datatype
    keep:
      []
    bypass:
      - Weights
      - Inputs
      - Outputs
  - target: ifmap_buffer
    type: datatype
    keep:
      - Weights
      - Inputs
    bypass:
      - Outputs
  - target: DRAM
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: ofmap_buffer
    type: spatial
    factors: R1 S3 P1 Q1 C1 K1 N1
    permutation: SRPQCKN
    split: 1
  - target: ofmap_buffer
    type: temporal
    factors: R1 S1 P1 Q1 C1 K1 N1
    permutation: RSPQCKN
  - target: weight_buffer
    type: temporal
    factors: R1 S1 P1 Q1 C1 K1 N1
    permutation: RSPQCKN
  - target: ifmap_buffer
    type: temporal
    factors: R3 S1 P16 Q2 C1 K1 N1
    permutation: RQPSCKN
  - target: DRAM
    type: temporal
    factors: R1 S1 P1 Q8 C1 K1 N1
    permutation: QRSPCKN