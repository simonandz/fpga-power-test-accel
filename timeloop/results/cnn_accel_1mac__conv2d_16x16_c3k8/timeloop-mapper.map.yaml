mapping:
  - target: ofmap_buffer
    type: datatype
    keep:
      - Outputs
    bypass:
      - Weights
      - Inputs
  - target: weight_buffer
    type: datatype
    keep:
      - Weights
    bypass:
      - Inputs
      - Outputs
  - target: ifmap_buffer
    type: datatype
    keep:
      - Inputs
    bypass:
      - Weights
      - Outputs
  - target: DRAM
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: ofmap_buffer
    type: temporal
    factors: R3 S1 P1 Q8 C1 K1 N1
    permutation: RQSPCKN
  - target: weight_buffer
    type: temporal
    factors: R1 S1 P1 Q1 C1 K1 N1
    permutation: RSPQCKN
  - target: ifmap_buffer
    type: temporal
    factors: R1 S3 P2 Q1 C3 K4 N1
    permutation: SCPKRQN
  - target: DRAM
    type: temporal
    factors: R1 S1 P8 Q2 C1 K2 N1
    permutation: KPQRSCN