# CNN Accelerator Architecture - 9-MAC, INT16 Variant (v0.3 format)
# Based on cnn_accel_9mac.yaml with all datawidths changed to 16-bit.
# Uses primitive component classes that Accelergy's built-in plug-ins support.

architecture:
  version: 0.3

  subtree:
    - name: system
      attributes:
        technology: "45nm"

      local:
      - name: DRAM
        class: DRAM
        attributes:
          width: 16
          datawidth: 16
          type: "LPDDR4"

      subtree:
      - name: chip

        local:
        - name: ifmap_buffer
          class: SRAM
          attributes:
            depth: 324
            width: 16
            datawidth: 16
            word_bits: 16
            n_banks: 1
            n_rdwr_ports: 2

        - name: weight_buffer
          class: SRAM
          attributes:
            depth: 9
            width: 16
            datawidth: 16
            word_bits: 16
            n_banks: 1
            n_rdwr_ports: 2

        - name: ofmap_buffer
          class: SRAM
          attributes:
            depth: 256
            width: 16
            datawidth: 16
            word_bits: 16
            n_banks: 1
            n_rdwr_ports: 2

        subtree:
        - name: PE[0..8]

          local:
          - name: mac
            class: intmac
            attributes:
              datawidth: 16
              width: 16
