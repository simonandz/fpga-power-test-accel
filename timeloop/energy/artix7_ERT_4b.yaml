# Artix-7 Energy Reference Table (ERT) - INT4 Variant
# MAC compute energy scaled to 1.75 pJ (~0.5x of INT8 3.5 pJ) due to reduced
# switching activity in DSP48E1 with narrower 4-bit operands.
# SRAM and DRAM per-access energies unchanged (BRAM port activation is fixed-cost).

ERT:
  version: '0.4'
  tables:
    - name: system.DRAM
      actions:
        - name: read
          arguments: {}
          energy: 200.0
        - name: write
          arguments: {}
          energy: 200.0
        - name: update
          arguments: {}
          energy: 200.0
        - name: leak
          arguments: {}
          energy: 0.0

    - name: system.chip.global_buffer
      actions:
        - name: read
          arguments: {}
          energy: 7.3
        - name: write
          arguments: {}
          energy: 7.3
        - name: update
          arguments: {}
          energy: 7.3
        - name: leak
          arguments: {}
          energy: 0.02

    - name: system.chip.ifmap_buffer
      actions:
        - name: read
          arguments: {}
          energy: 7.3
        - name: write
          arguments: {}
          energy: 7.3
        - name: update
          arguments: {}
          energy: 7.3
        - name: leak
          arguments: {}
          energy: 0.02

    - name: system.chip.weight_buffer
      actions:
        - name: read
          arguments: {}
          energy: 7.3
        - name: write
          arguments: {}
          energy: 7.3
        - name: update
          arguments: {}
          energy: 7.3
        - name: leak
          arguments: {}
          energy: 0.02

    - name: system.chip.ofmap_buffer
      actions:
        - name: read
          arguments: {}
          energy: 7.3
        - name: write
          arguments: {}
          energy: 7.3
        - name: update
          arguments: {}
          energy: 7.3
        - name: leak
          arguments: {}
          energy: 0.02

    - name: system.chip.PE[0..8].mac
      actions:
        - name: compute
          arguments: {}
          energy: 1.75
        - name: leak
          arguments: {}
          energy: 0.01

    - name: system.chip.PE[0..2].mac
      actions:
        - name: compute
          arguments: {}
          energy: 1.75
        - name: leak
          arguments: {}
          energy: 0.01

    - name: system.chip.PE[0..0].mac
      actions:
        - name: compute
          arguments: {}
          energy: 1.75
        - name: leak
          arguments: {}
          energy: 0.01
