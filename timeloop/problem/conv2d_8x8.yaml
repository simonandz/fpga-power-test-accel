# Workload: 3x3 Convolution on 8x8 Input (TINY)
# Minimal workload variant for exploring small-config space
# Output: 8x8 (with pad=1, stride=1)

problem:
  shape:
    name: Conv2D
    dimensions: [R, S, P, Q, C, K, N]
    coefficients:
      - name: Wstride
        default: 1
      - name: Hstride
        default: 1
    data-spaces:
      - name: Weights
        projection:
          - [[C]]
          - [[K]]
          - [[R]]
          - [[S]]
      - name: Inputs
        projection:
          - [[N]]
          - [[C]]
          - [[R], [P, Hstride]]
          - [[S], [Q, Wstride]]
      - name: Outputs
        projection:
          - [[N]]
          - [[K]]
          - [[P]]
          - [[Q]]
        read-write: true
  instance:
    R: 3
    S: 3
    P: 8              # output height (8x8)
    Q: 8              # output width
    C: 1
    K: 1
    N: 1
    Wstride: 1
    Hstride: 1
