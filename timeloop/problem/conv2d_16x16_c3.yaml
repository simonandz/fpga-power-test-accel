# Workload: 3x3 Convolution on 16x16 Input, 3 Channels (MULTI-C / RGB)
# Multi-channel input: simulates processing an RGB image
# Output: 16x16 x 1 filter
# RTL implication: requires multi-channel support (iterate over C=3)

problem:
  shape:
    name: Conv2D
    dimensions: [R, S, P, Q, C, K, N]
    coefficients:
      - name: Wstride
        default: 1
      - name: Hstride
        default: 1
    data-spaces:
      - name: Weights
        projection:
          - [[C]]
          - [[K]]
          - [[R]]
          - [[S]]
      - name: Inputs
        projection:
          - [[N]]
          - [[C]]
          - [[R], [P, Hstride]]
          - [[S], [Q, Wstride]]
      - name: Outputs
        projection:
          - [[N]]
          - [[K]]
          - [[P]]
          - [[Q]]
        read-write: true
  instance:
    R: 3
    S: 3
    P: 16
    Q: 16
    C: 3              # 3 input channels (RGB)
    K: 1
    N: 1
    Wstride: 1
    Hstride: 1
