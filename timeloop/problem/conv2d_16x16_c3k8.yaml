# Workload: 3x3 Convolution on 16x16 Input, C=3, K=8 (REALISTIC)
# Realistic first conv layer of a small CNN (e.g., LeNet-style)
# 3 input channels (RGB), 8 output filters
# This is the most compute-intensive workload variant

problem:
  shape:
    name: Conv2D
    dimensions: [R, S, P, Q, C, K, N]
    coefficients:
      - name: Wstride
        default: 1
      - name: Hstride
        default: 1
    data-spaces:
      - name: Weights
        projection:
          - [[C]]
          - [[K]]
          - [[R]]
          - [[S]]
      - name: Inputs
        projection:
          - [[N]]
          - [[C]]
          - [[R], [P, Hstride]]
          - [[S], [Q, Wstride]]
      - name: Outputs
        projection:
          - [[N]]
          - [[K]]
          - [[P]]
          - [[Q]]
        read-write: true
  instance:
    R: 3
    S: 3
    P: 16
    Q: 16
    C: 3              # 3 input channels (RGB)
    K: 8              # 8 output filters
    N: 1
    Wstride: 1
    Hstride: 1
