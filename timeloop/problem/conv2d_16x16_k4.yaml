# Workload: 3x3 Convolution on 16x16 Input, 4 Output Filters (MULTI-K)
# Multiple output filters: produces 4 output feature maps
# RTL implication: requires multi-filter support (iterate over K=4)

problem:
  shape:
    name: Conv2D
    dimensions: [R, S, P, Q, C, K, N]
    coefficients:
      - name: Wstride
        default: 1
      - name: Hstride
        default: 1
    data-spaces:
      - name: Weights
        projection:
          - [[C]]
          - [[K]]
          - [[R]]
          - [[S]]
      - name: Inputs
        projection:
          - [[N]]
          - [[C]]
          - [[R], [P, Hstride]]
          - [[S], [Q, Wstride]]
      - name: Outputs
        projection:
          - [[N]]
          - [[K]]
          - [[P]]
          - [[Q]]
        read-write: true
  instance:
    R: 3
    S: 3
    P: 16
    Q: 16
    C: 1
    K: 4              # 4 output filters
    N: 1
    Wstride: 1
    Hstride: 1
